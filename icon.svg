<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="uBgA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080a12" stop-opacity="1"/>
    </radialGradient>

    <!-- Tier 1: Foundation (Analyst) - Deep Tech Cobalt -->
    <linearGradient id="tier1Grad" x1="280" y1="720" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Tier 2: Acceleration (Lead) - Electric Cyan into Violet -->
    <linearGradient id="tier2Grad" x1="380" y1="580" x2="680" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Tier 3: Pinnacle (Architect) - Luminous Coral to Solar Gold Spark -->
    <linearGradient id="tier3Grad" x1="520" y1="420" x2="780" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Shading & Ambient Depth -->
    <filter id="prismShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-10" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#uBgA)"/>

  <g transform="translate(512, 512) scale(1.08) translate(-512, -512)">
    <!-- TIER 1: Foundation Level (Isometric base plane) -->
    <path d="M 240 680 L 440 540 L 440 640 L 240 780 Z" fill="#1e3a8a" opacity="0.9"/>
    <path d="M 240 680 L 440 540 L 580 620 L 380 760 Z" fill="url(#tier1Grad)"/>

    <!-- TIER 2: Lead Level (Middle ascending plane with drop shadow) -->
    <g filter="url(#prismShadow)">
      <path d="M 360 520 L 560 380 L 560 480 L 360 620 Z" fill="#4338ca" opacity="0.85"/>
      <path d="M 360 520 L 560 380 L 700 460 L 500 600 Z" fill="url(#tier2Grad)"/>
    </g>

    <!-- TIER 3: Architect Level (Top apex plane soaring upward) -->
    <g filter="url(#prismShadow)">
      <path d="M 480 360 L 680 220 L 680 320 L 480 460 Z" fill="#701a75" opacity="0.8"/>
      <path d="M 480 360 L 680 220 L 820 300 L 620 440 Z" fill="url(#tier3Grad)"/>
    </g>

    <!-- ARCHITECT APEX DIAMOND (The North Star Zenith) -->
    <g filter="url(#prismShadow)">
      <polygon points="680,140 730,190 680,240 630,190" fill="#fbbf24"/>
      <polygon points="680,160 710,190 680,220 650,190" fill="#ffffff"/>
    </g>
  </g>
</svg>