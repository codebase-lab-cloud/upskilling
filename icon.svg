    <!-- Ascending Career Progression Chevrons / Growth Trajectory -->
    <path d="M -65 42 L -15 -10 L 35 32 L 115 -55" 
          fill="none" stroke="url(#upGrowthGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Growth Arrowhead -->
    <path d="M 65 -55 H 115 V -5" 
          fill="none" stroke="url(#upGrowthGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Architect Apex Diamond Star -->
    <path d="M 125 -118 L 142 -135 L 159 -118 L 142 -101 Z" 
          fill="url(#upApexGrad)"/>
    <circle cx="142" cy="-118" r="4.5" fill="#ffffff"/>
