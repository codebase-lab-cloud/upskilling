<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with squircle curve -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4" />
  
  <!-- Subtle ambient glow circle -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" />

  <!-- Bar 1: Base Analyst -->
  <rect x="110" y="270" width="52" height="130" rx="14" fill="#3b82f6" opacity="0.8" />
  
  <!-- Bar 2: Senior Specialist -->
  <rect x="186" y="210" width="52" height="190" rx="14" fill="#6366f1" opacity="0.9" />
  
  <!-- Bar 3: Lead Consultant -->
  <rect x="262" y="150" width="52" height="250" rx="14" fill="#8b5cf6" />
  
  <!-- Bar 4: Enterprise Architect -->
  <rect x="338" y="90" width="52" height="310" rx="14" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Dynamic Trend Arrow / North Star -->
  <path d="M 120 250 Q 230 190, 360 80" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.7" />
  
  <!-- Architect Star Diamond at apex -->
  <polygon points="364,52 376,76 400,76 380,92 388,116 364,100 340,116 348,92 328,76 352,76" fill="#38bdf8" filter="url(#glow)" />
</svg>
